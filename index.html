<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tin học 7 – Bài 02: Phần mềm máy tính</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BIẾN CSS – GIÁO VIÊN CÓ THỂ THAY MÀU SẮC TẠI ĐÂY
   ============================================================ */
:root{
  --color-bg:#f3f7ff;
  --color-bg-alt:#ffffff;
  --color-primary:#4f46e5;
  --color-primary-dark:#3730a3;
  --color-secondary:#06b6d4;
  --color-accent:#f59e0b;
  --color-pink:#ec4899;
  --color-purple:#8b5cf6;
  --color-ink:#0f2a3d;
  --color-ink-soft:#4a6072;
  --color-card:#ffffff;
  --color-line:#d7e6eb;
  --color-success:#1e8a4c;
  --color-success-bg:#e5f6ec;
  --color-error:#c8402c;
  --color-error-bg:#fbe9e6;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 4px 18px rgba(14,42,61,0.08);
  --nav-h:64px;
  --progress-h:6px;
  --font:'Be Vietnam Pro', 'Segoe UI', Tahoma, Arial, sans-serif;
}
[data-theme="dark"]{
  --color-bg:#0c1c26;
  --color-bg-alt:#122939;
  --color-card:#122939;
  --color-ink:#eef6f8;
  --color-ink-soft:#a9c0cc;
  --color-line:#1f3e4e;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font);
  background:var(--color-bg);
  color:var(--color-ink);
  padding-top:calc(var(--nav-h) + var(--progress-h));
  line-height:1.55;
}
h1,h2,h3,h4{font-family:var(--font);font-weight:700;margin:0 0 .5em;color:var(--color-ink);}
p{margin:0 0 1em;color:var(--color-ink-soft);}
button{font-family:var(--font);cursor:pointer;}
img,svg{max-width:100%;}
:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px;}

/* ==== THANH ĐIỀU HƯỚNG CỐ ĐỊNH ==== */
#topbar{position:fixed;top:0;left:0;right:0;z-index:500;background:var(--color-bg-alt);box-shadow:var(--shadow);}
#progressbar{height:var(--progress-h);background:var(--color-line);}
#progressfill{height:100%;background:linear-gradient(90deg,var(--color-secondary),var(--color-primary));width:0%;transition:width .4s ease;}
#navrow{height:var(--nav-h);display:flex;align-items:center;padding:0 12px;gap:8px;}
#navtoggle{display:none;background:var(--color-primary);color:#fff;border:none;border-radius:var(--radius-sm);padding:8px 12px;font-weight:600;}
#navlogo{font-weight:800;color:var(--color-primary);white-space:nowrap;font-size:.85rem;padding-right:6px;flex-shrink:0;}
#navlist{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:thin;}
.navbtn{border:none;background:transparent;color:var(--color-ink-soft);padding:8px 12px;border-radius:999px;font-size:.82rem;font-weight:600;white-space:nowrap;flex-shrink:0;transition:.15s;}
